name: E2E Tests

# 拆成两档，把日常提交的反馈时间从 ~9min 压到 ~3min
#   smoke —— 任何 push/PR 都跑：chromium + 仅 @smoke 用例（e2e/smoke.e2e.ts 等）
#   full  —— 仅 PR / main / 夜间定时 / 手动触发：40 unique × chromium+webkit 全量
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  smoke:
    name: Smoke (chromium, @smoke)
    runs-on: ubuntu-latest
    env:
      # 后端解释器：CI 直接用系统 python（sqlite + FakeRedis 零外部依赖），
      # playwright.config.ts 会以 E2E_PYTHON 组装 tests.settings_e2e 的启动命令
      E2E_PYTHON: python3
      # server 仓库检出为工作区内的兄弟目录（playwright webServer cwd）
      E2E_SERVER_DIR: xadmin-server
      CI: "1"
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Setup E2E environment
        uses: ./.github/actions/e2e-setup

      - name: Run smoke E2E
        # playwright.config.ts 的 webServer 会自动：种子重置（e2e_seed.py）→
        # 拉起 tests.settings_e2e 后端（sqlite + FakeRedis，零外部依赖）→ vite dev
        run: pnpm test:e2e:smoke

      - uses: actions/upload-artifact@v4
        if: always()
        name: Upload smoke report
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    name: Full (chromium + webkit)
    needs: smoke
    # dev push 只吃 smoke 反馈；全量留给 PR、main、夜间与手动，避免阻塞日常提交
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      E2E_PYTHON: python3
      E2E_SERVER_DIR: xadmin-server
      CI: "1"
      # 并行分片：runner 4 vCPU 取 3 路（vite/daphne/浏览器各一份），全量 ~12m → ~5m。
      # --reporter=list 覆盖配置里的 html reporter：4 个 shard 进程不能共写 playwright-report/
      # （失败现场仍由 test-results/ 逐用例目录承载，upload 不受影响）
      E2E_PARALLEL: "3"
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Setup E2E environment
        uses: ./.github/actions/e2e-setup

      - name: Run full E2E (parallel shards)
        run: pnpm test:e2e:parallel --reporter=list

      - uses: actions/upload-artifact@v4
        if: always()
        name: Upload full report
        with:
          name: playwright-report-full
          path: |
            playwright-report/
            test-results/
          retention-days: 7
