name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  e2e:
    name: Playwright (chromium + webkit)
    runs-on: ubuntu-latest
    env:
      # 后端解释器：CI 直接用系统 python（sqlite + FakeRedis 零外部依赖），
      # playwright.config.ts 会以 E2E_PYTHON 组装 tests.settings_e2e 的启动命令
      E2E_PYTHON: python3
      # server 仓库检出为工作区内的兄弟目录（playwright webServer cwd）
      E2E_SERVER_DIR: xadmin-server
      CI: "1"
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Checkout server repository
        uses: actions/checkout@v4
        with:
          repository: nineaiyu/xadmin-server
          path: xadmin-server
          ref: dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          version: 11
          run_install: false

      - name: Set up Python (backend under test)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: xadmin-server/requirements.txt

      - name: Install backend dependencies
        # 测试环境使用 sqlite3，无需编译 mysqlclient
        run: |
          cd xadmin-server
          python -m pip install --upgrade pip
          grep -v '^mysqlclient' requirements.txt > /tmp/requirements-e2e.txt
          pip install -r /tmp/requirements-e2e.txt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run E2E tests
        # playwright.config.ts 的 webServer 会自动：种子重置（e2e_seed.py）→
        # 拉起 tests.settings_e2e 后端（sqlite + FakeRedis，零外部依赖）→ vite dev
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        name: Upload Playwright report
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
