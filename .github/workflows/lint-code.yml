name: Lint Code

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v3
        name: Install pnpm
        id: pnpm-install
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Prettier format check
        run: pnpm lint:prettier:check

      - name: Start Lint Code
        run: |
          pnpm install --no-frozen-lockfile
          pnpm lint
          pnpm typecheck
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests (coverage gate)
        # T4.2：vitest 覆盖率阈值（statements/branches/functions/lines）在 CI 强制生效
        run: pnpm test:coverage

      - name: Metadata contract types are up to date (T2.3)
        run: |
          pnpm gen:metadata-types
          git diff --exit-code -- src/api/types

      - name: Checkout contract source (xadmin-server)
        # 服务端是契约唯一真源：检出其开发分支用于校验镜像是否漂移
        uses: actions/checkout@v4
        with:
          repository: nineaiyu/xadmin-server
          ref: dev
          path: xadmin-server

      - name: Metadata contract mirror is in sync
        # 客户端 contract/schema 为服务端 docs/schema 的镜像；
        # 服务端改契约而镜像未同步时在此失败（此前两侧无任何一致性校验）
        env:
          XADMIN_SERVER_DIR: xadmin-server
        run: pnpm check:contract
