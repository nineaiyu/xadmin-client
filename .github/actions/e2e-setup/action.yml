name: E2E setup
description: >
  准备 E2E 运行环境：检出 xadmin-server 到工作区、安装前后端依赖与 Playwright 浏览器。
  后端以 tests.settings_e2e 运行（真实 PostgreSQL[由 e2e.yml 的 postgres service 提供，
  DB_HOST/DB_PORT 走其缺省 127.0.0.1:55433] + 进程内 FakeRedis）；本 action 被 e2e.yml
  的 smoke / visual / full 三个 job 复用，避免同一份安装步骤复制两遍。

inputs:
  server-dir:
    description: xadmin-server 检出路径（playwright webServer 的 cwd）
    required: false
    default: xadmin-server
  server-ref:
    description: xadmin-server 检出分支
    required: false
    default: dev

runs:
  using: composite
  steps:
    - name: Checkout server repository
      uses: actions/checkout@v4
      with:
        repository: nineaiyu/xadmin-server
        path: ${{ inputs.server-dir }}
        ref: ${{ inputs.server-ref }}

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 11.25.0
        run_install: false

    - name: Set up Node
      # cache: pnpm 需要 pnpm 二进制先就位（计算 lockfile hash），故
      # pnpm/action-setup 必须前置，否则报 "Unable to locate executable file: pnpm"
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Set up Python (backend under test)
      uses: actions/setup-python@v5
      with:
        # 与 pyproject requires-python（>=3.14）及 server CI 门禁同口径（O9-5）
        python-version: "3.14"
        cache: pip
        cache-dependency-path: ${{ inputs.server-dir }}/requirements.txt

    - name: Install backend dependencies
      # E2E 真库化（全真容器化测试迁移方案阶段 4）：后端连 postgres service（settings_e2e
      # 缺省 127.0.0.1:55433，user/password 与 service env 对齐）；缓存为进程内 FakeRedis，
      # 依赖 fakeredis（requirements-dev.txt 中的测试专用依赖）；无需编译 mysqlclient
      shell: bash
      run: |
        cd ${{ inputs.server-dir }}
        python -m pip install --upgrade pip
        grep -v '^mysqlclient' requirements.txt > /tmp/requirements-e2e.txt
        pip install -r /tmp/requirements-e2e.txt "fakeredis[lua]>=2.23"

    - name: Compile backend translations
      # locale/*.mo 被 gitignore，全新检出没有编译翻译；USE_I18N=True 时缺 .mo
      # 会回退英文源串，用例断言的中文文案（锁定提示等）全部落空
      shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq gettext > /dev/null
        cd ${{ inputs.server-dir }} && django-admin compilemessages -l zh

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright browsers
      shell: bash
      run: pnpm exec playwright install --with-deps chromium webkit
