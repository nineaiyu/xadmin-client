shellEmulator: true
shamefullyHoist: true
enablePrePostScripts: false
strictPeerDependencies: false
minimumReleaseAge: 0

# T5.1 供应链治理：传递依赖已知漏洞版本强制升到修复线（官方源 pnpm audit 驱动，2026-09-07）
# 原则：仅范围内最小跳版；上游发布包含修复后应删除对应条目
overrides:
  'preact@<10.28.2': '>=10.28.2'
  'devalue@<5.6.4': '>=5.6.4'
  'minimatch@>=9 <9.0.7': '>=9.0.7'
  'rollup@<4.59': '>=4.59.0'
  'flatted@<3.4.2': '>=3.4.2'
  'path-to-regexp@>=8 <8.4': '>=8.4.0'
  'lodash-es@<4.18.1': '>=4.18.1'
  'defu@<=6.1.4': '>=6.1.5'
  'fast-uri@<3.1.6': '>=3.1.6'
  'nanoid@<3.3.18': '>=3.3.18'
  'browserslist@<=4.28.6': '>=4.28.7'
  'esbuild': '>=0.28.1'
  'svelte@<5.55.7': '>=5.55.7'
  'ajv@>=7 <8.18': '>=8.18.0'
  'brace-expansion@<2.0.3': '>=2.1.4'
  'picomatch@<2.3.2': '>=2.3.2'
  'yaml@<2.8.3': '>=2.8.3'
  'postcss@<8.5.23': '>=8.5.28'
  'js-yaml@<4.3': '>=4.3.1'
  '@humanfs/node@<0.16.8': '>=0.16.8'
  'postcss-selector-parser@>=7.1.0 <7.1.3': '>=7.1.3'

allowedDeprecatedVersions:
  are-we-there-yet: '*'
  sourcemap-codec: '*'
  lodash.isequal: '*'
  domexception: '*'
  w3c-hr-time: '*'
  inflight: '*'
  npmlog: '*'
  rimraf: '*'
  stable: '*'
  gauge: '*'
  abab: '*'
  glob: '*'
  ini: '*'

allowBuilds:
  '@tailwindcss/oxide': false
  '@parcel/watcher': true
  vue-demi: true
  esbuild: true
  es5-ext: true
  core-js: true
  typeit: true
  node-pty: false
